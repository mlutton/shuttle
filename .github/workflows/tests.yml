name: tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: tests (unittest)
    runs-on: ubuntu-latest
    # As of 2026-11-25 the check takes under a minute; a run past 10 minutes is a hang.
    # The by-value tests (20 seconds) and the real-process tests (120 seconds) inside it each have a budget (see checks/all.sh).
    timeout-minutes: 10
    env:
      # The tests that run a real executor need the boundary (systemd-run, systemctl, bwrap); with
      # this set, its absence fails them instead of skipping them (tests/rehearsal/the_boundary.py).
      SHUTTLE_REQUIRE_BOUNDARY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the development tools
        run: python3 -m pip install -r requirements-dev.txt
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Run the check
        run: ./checks/all.sh
      - name: Report tests, time, memory and coverage
        # A second run of the suite, under coverage (see checks/report.py). It never changes
        # whether the job passes; if the report cannot be made, it says so in one line. The
        # same bytes go to the job summary and to the artifact below.
        if: always()
        env:
          # What the report needs to name the pull request's own head, not GitHub's merge.
          REPORT_EVENT_NAME: ${{ github.event_name }}
          REPORT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPORT_RUN_SHA: ${{ github.sha }}
        run: |
          ./checks/report.sh > "$RUNNER_TEMP/report.md" || true
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: ${{ runner.temp }}/report.md
          retention-days: 7

  base-check:
    name: base check (unittest)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHUTTLE_REQUIRE_BOUNDARY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the development tools
        run: python3 -m pip install -r requirements-dev.txt
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: List the guard files this pull request changes
        # The listing never fails the job; if it cannot be made, the summary says so.
        # The same bytes go to the job summary and to the artifact below.
        run: |
          ./checks/guard-files.sh "$BASE_SHA" > "$RUNNER_TEMP/guard-files.md" || true
          cat "$RUNNER_TEMP/guard-files.md" >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Run the base branch's check on this tree
        run: ./checks/base-check.sh "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Keep the guard listing as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-files
          path: ${{ runner.temp }}/guard-files.md
          retention-days: 7
