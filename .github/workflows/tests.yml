name: tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: tests (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: timeout 20 python3 -m unittest discover -s tests   # a time budget: the suite takes about 3 s; it took 19 s before waits were put behind a seam
