name: tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: tests (unittest)
    runs-on: ubuntu-latest
    # As of 2026-11-25 the check takes under a minute; a run past 10 minutes is a hang.
    # The suite inside it has its own 20 second budget (see checks/all.sh).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the development tools
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run the check
        run: ./checks/all.sh

  base-check:
    name: base check (unittest)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the development tools
        run: python3 -m pip install -r requirements-dev.txt
      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: List the guard files this pull request changes
        run: ./checks/guard-files.sh "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY" || true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Run the base branch's check on this tree
        run: ./checks/base-check.sh "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
