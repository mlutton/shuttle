# Tool settings only. Shuttle has no runtime dependencies.

[tool.ruff]
line-length = 100
target-version = "py312"  # minimum Python: 3.12 (the whole suite passes on it; on 3.11 one command test fails)

[tool.ruff.lint]
# E4, E7, E9: pycodestyle errors; F: pyflakes; I: import order; B: bugbear;
# UP: pyupgrade; SIM: simplify; C901: complexity per function.
# TID251: libraries that reach the world are banned outside the world folder (see below).
# PLR1702: at most three nested blocks in a function, tests included.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C901", "TID251", "PLR1702"]
# PLR1702 is a preview rule in ruff 0.14.10. With explicit-preview-rules only the rules
# named in select are previewed; no other preview rule turns on.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
# As of 2026-11-25: the most complex functions are _decide_before_launch and
# _decide_after_launch (10 each); _decide (24) and validate_document (19) were split to get there.
max-complexity = 10

[tool.ruff.lint.pylint]
# As of 2026-11-25: the deepest nesting in the package is 3; one test was 5 deep and was flattened.
max-nested-blocks = 3

