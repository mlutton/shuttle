[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only, so that a banned module cannot be reached by a relative form
# such as "from . import run".
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Where the libraries on the ban list may be imported: the world folder, and the tests. Everything
# else under shuttle/ (the core folder, sub-folders included) is held to the ban.
# Two more are exempt, for another reason. The shell folder and the entry file import
# `shuttle.shell`, which the same rule bans so that the core cannot (ruff cannot ban an import in
# one folder only). The shell holds no banned library: tests/by_value/test_rules.py gives it an
# allow-list of standard library modules, refuses `open` and `print`, and lets only shell/cli.py
# import the world.
"shuttle/world/**" = ["TID251"]  # the world: files, processes, the clock, signals, the environment, identity, streams
"shuttle/shell/**" = ["TID251"]  # imports its own siblings (see above); held to its allow-list by the rule test
"shuttle/__main__.py" = ["TID251"]  # hands straight to the shell's command line
"tests/**" = ["TID251"]  # tests spawn processes and use temporary folders; the ban is for the package

[tool.coverage.run]
# Read by checks/report.py (the per-run report), never by ./checks/all.sh. It writes these out
# with absolute paths and a data file outside the tree. patch = subprocess measures the child
# processes the command tests start (coverage.py 7.10 and later), parallel keeps one data file
# per process until they are combined.
source = ["shuttle", "checks"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
# A line (or a block it opens) ending in "# not tested: <reason>" is deliberately untested; the
# rule test refuses an empty reason and the report lists every one.
exclude_also = ["# not tested:"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["shuttle", "checks"]
