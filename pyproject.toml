[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only, so that a banned module cannot be reached by a relative form
# such as "from . import run".
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# The shell: the modules allowed to reach the world. Every other module in shuttle/ is core.
"shuttle/__main__.py" = ["TID251"]  # the entry point: reads sys.argv and exits
"shuttle/cli.py" = ["TID251"]  # the command line: reads argv, writes the standard streams
"shuttle/records.py" = ["TID251"]  # reads and writes the two record files
"shuttle/run.py" = ["TID251"]  # the run: clock, signals, files, environment, host name, processes
"tests/**" = ["TID251"]  # tests spawn processes and use temporary folders; the ban is for the package

[tool.shuttle.modules]
# Every module in shuttle/, sub-folders included, is named here as core or shell. The
# classification is the rule. The core decides and touches nothing; the shell touches the
# world. tests/by_value/test_rules.py fails on a module that is in neither list (or on a
# name here with no file) and on a core module that imports anything but another core
# module or a standard library module on its short allow-list. The ruff settings above
# (the shell modules banned, the per-file ignores) must agree with these lists; a test
# checks that they do.
core = [
    "shuttle",  # __init__.py: the version string
    "shuttle.command_driver",
    "shuttle.core",
    "shuttle.fixed",
    "shuttle.shapes",
    "shuttle.stand_ins",
]
shell = [
    "shuttle.__main__",  # reads sys.argv and exits
    "shuttle.cli",  # reads argv, writes the standard streams
    "shuttle.records",  # reads and writes the record files
    "shuttle.run",  # the run: clock, signals, files, environment, host name, processes
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["shuttle"]
