# Tool settings only. Shuttle has no runtime dependencies.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E4, E7, E9: pycodestyle errors; F: pyflakes; I: import order; B: bugbear;
# UP: pyupgrade; SIM: simplify; C901: complexity per function.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C901"]

[tool.ruff.lint.mccabe]
# As of 2026-11-25. See the pull request for the most complex functions at that date.
max-complexity = 12

[tool.mypy]
python_version = "3.12"
strict = true
files = ["shuttle"]
